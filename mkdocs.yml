site_name: pymal
site_url: https://varyg1001.github.io/pymal/
site_description: A Python library for interacting with MyAnimeList
repo_name: varyg1001/pymal
repo_url: https://github.com/varyg1001/pymal
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - API Reference:
      - Anime: api/anime.md
      - Manga: api/manga.md
      - Account: api/account.md
      - MyAnime: api/my_anime.md
      - MyManga: api/my_manga.md
  - Testing: testing.md
  - Changelog: changelog.md

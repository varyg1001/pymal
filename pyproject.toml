[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "pymal-ng"
version = "2.0.0"
requires-python = ">=3.11,<3.15"
description = "A python api for the website MyAnimeList (or MAL)."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "varyg" }]
keywords = ["myanimelist", "mal", "anime", "manga", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "niquests[socks,utls]<4.0.0,>=3.13.1",
    "beautifulsoup4<5.0.0,>=4.12.3",
    "lxml<7.0.0,>=6.0.0",
    "pillow>=13.0.0",
    "singleton-factory>=0.1",
]

[project.urls]
Homepage = "https://varyg1001.github.io/pymal/"
Documentation = "https://varyg1001.github.io/pymal/"
Source = "https://github.com/varyg1001/pymal"
Upstream = "https://github.com/pymal-developers/pymal"

[tool.uv]
default-groups = "all"
package = true

[tool.uv.build-backend]
module-root = "."
module-name = "pymal"

[dependency-groups]
dev = [
    "ruff<1.0.0,>=0.11.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "T20", "SIM", "ARG", "PTH"]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".nox", ".pytest_cache", ".ruff_cache",
    ".svn", ".tox", ".venv", "__pypackages__",
    "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]
line-length = 90
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[[tool.mypy.overrides]]
ignore_errors = true
ignore_missing_imports = true

name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Lint
        if: matrix.python-version == '3.14'
        run: uvx ruff check pymal tests

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q
